name: Check backend

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/check-backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/check-backend.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('backend/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: backend/target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('backend/Cargo.lock') }}

      - name: Build backend
        run: cargo build --locked

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cargo-build-artifacts
          path: |
            backend/target
            backend/Cargo.lock
          retention-days: 1

  prepare-database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/backend/radicalise-test.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Cache sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-0.8.3-native-tls-sqlite

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.3 --no-default-features --features native-tls,sqlite

      - name: Create database and run migrations
        run: |
          sqlite3 "${{ github.workspace }}/backend/radicalise-test.db" "VACUUM;"
          sqlx migrate run

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-artifact
          path: backend/radicalise-test.db
          retention-days: 1

  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  sqlx-prepare:
    needs: [build, prepare-database]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/backend/radicalise-test.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache sqlx-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/sqlx
          key: ${{ runner.os }}-sqlx-cli-0.8.3-native-tls-sqlite

      - name: Install sqlx-cli
        run: cargo install sqlx-cli --version 0.8.3 --no-default-features --features native-tls,sqlite

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cargo-build-artifacts
          path: backend

      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: database-artifact
          path: backend

      - name: Check sqlx prepare cache is up to date
        run: cargo sqlx prepare --check -- --bin radicalise

  clippy:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      SQLX_OFFLINE: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cargo-build-artifacts
          path: backend

      - name: Run clippy
        run: cargo clippy -- -D warnings

  test:
    needs: [build, prepare-database]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/backend/radicalise-test.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: cargo-build-artifacts
          path: backend

      - name: Download database artifact
        uses: actions/download-artifact@v4
        with:
          name: database-artifact
          path: backend

      - name: Run cargo tests
        run: cargo test --locked
