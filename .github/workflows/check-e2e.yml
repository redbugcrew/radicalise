name: Check e2e

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/check-e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/check-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    env:
      DATABASE_URL: sqlite://${{ github.workspace }}/backend/data/test/test_radicalise.sqlite
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 build-essential libssl-dev pkg-config just

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize test database
        run: just db-test-init

      - name: Start backend
        run: |
          cd backend
          cargo run --background &
          # Wait for backend to be ready
          until curl -s localhost:8200/api-docs/openapi.json > /dev/null; do
            echo "Waiting for backend..."
            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Start frontend
        run: |
          npm run build
          npm run preview &
          # Wait for frontend to be ready
          until curl -s localhost:5173 > /dev/null; do
            echo "Waiting for frontend..."
            sleep 2
          done

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
